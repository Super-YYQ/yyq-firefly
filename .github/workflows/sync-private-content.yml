name: Sync private knowledge base

on:
  repository_dispatch:
    types: [private-content-updated]
  workflow_dispatch:

concurrency:
  group: sync-private-content
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Firefly
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master

      - name: Checkout private knowledge base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Super-YYQ/yyq-firefly-private
          ref: main
          token: ${{ secrets.PRIVATE_KB_READ_TOKEN }}
          path: private-content

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.22.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Synchronize published content
        run: >-
          pnpm run sync:published --
          --source "$GITHUB_WORKSPACE/private-content"
          --output "src/content/posts"
          --prune

      - name: Check content
        run: pnpm check

      - name: Check types
        run: pnpm type-check

      - name: Commit synchronized content
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/content/posts

          if git diff --cached --quiet; then
            echo "No published-content changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: sync published private content"
          git push origin HEAD:master
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger site deployment
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          curl --fail-with-body --request POST
          --url https://api.github.com/repos/Super-YYQ/yyq-firefly/actions/workflows/deploy.yml/dispatches
          --header "Accept: application/vnd.github+json"
          --header "Authorization: Bearer $GH_TOKEN"
          --header "X-GitHub-Api-Version: 2022-11-28"
          --data '{"ref":"master"}'
