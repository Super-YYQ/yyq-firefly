name: Sync private knowledge base

on:
  repository_dispatch:
    types: [private-content-updated]
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Private repository commit SHA to republish"
        required: true

concurrency:
  group: sync-private-content
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve source SHA
        id: source
        shell: bash
        run: |
          SOURCE_SHA="${{ github.event.client_payload.source_sha || github.event.inputs.source_sha }}"
          if [[ -z "$SOURCE_SHA" ]]; then
            echo "::error::No source_sha available. repository_dispatch must carry client_payload.source_sha; workflow_dispatch requires the source_sha input."
            exit 1
          fi
          echo "Resolved private source SHA: $SOURCE_SHA"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout Firefly
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master

      - name: Checkout private knowledge base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Super-YYQ/yyq-firefly-private
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.PRIVATE_KB_READ_TOKEN }}
          path: private-content
          persist-credentials: false

      - name: Verify checked-out source SHA
        shell: bash
        run: |
          cd private-content
          ACTUAL_SHA="$(git rev-parse HEAD)"
          EXPECTED_SHA="${{ steps.source.outputs.sha }}"
          echo "Checked-out private SHA: $ACTUAL_SHA"
          echo "Expected private SHA:   $EXPECTED_SHA"
          if [[ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::Checked-out private SHA does not match the event source_sha. Aborting to keep validation and publishing on the same commit."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.22.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Synchronize published content
        run: >-
          pnpm run sync:published --
          --source "$GITHUB_WORKSPACE/private-content"
          --output "src/content/posts"
          --prune

      - name: Scan synced content for secrets
        # Final safety net before any generated content is committed to the
        # public repository. Uses the Biome-independent patterns from the
        # private vault audit, applied to the files that are actually about
        # to be committed.
        shell: bash
        run: pnpm exec tsx scripts/audit-synced-content.ts --output "src/content/posts"

      - name: Check content
        run: pnpm check

      - name: Check types
        run: pnpm type-check

      - name: Build site
        # A green public commit must already be a deployable snapshot: catch
        # Markdown/MDX rendering and build pipeline failures here, not on
        # Cloudflare Pages.
        run: pnpm build

      - name: Commit synchronized content
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/content/posts

          if git diff --cached --quiet; then
            echo "No published-content changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: sync published private content"
          git push origin HEAD:master
          echo "changed=true" >> "$GITHUB_OUTPUT"
